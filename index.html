<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증시 아침 브리핑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 디자인: 토스증권(여백·글꼴·빨강/파랑·지표 타일) + Fox Stocks(왼쪽 사이드바·라벤더 강조·파스텔 카드) */
:root{
  --bg:#f2f4f6; --card:#fff; --ink:#191f28; --sub:#6b7684; --faint:#8b95a1; --line:#e5e8eb; --soft:#f2f4f6;
  --up:#f04452; --up-bg:#fdeced; --down:#3182f6; --down-bg:#e8f3ff; --flat:#6b7684; --flat-bg:#f2f4f6;
  --accent:#6b5cff; --accent-ink:#fff; --accent-soft:#f0eeff;
  --warn:#b45309; --warn-bg:#fff6e5;
  --p1:#ece8ff; --p2:#def7ea; --p3:#ffeedd; --p4:#e1f0ff; --p5:#fdf5d6;
  --radius:18px; --shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101014; --card:#1b1b21; --ink:#ececf1; --sub:#a0a0ad; --faint:#7d7d8a; --line:#2b2b33; --soft:#24242b;
    --up:#ff5f6d; --up-bg:#3a1c22; --down:#5b9bff; --down-bg:#172640; --flat:#a0a0ad; --flat-bg:#24242b;
    --accent:#9d8fff; --accent-ink:#15121f; --accent-soft:#25213d;
    --warn:#fbbf24; --warn-bg:#33270f;
    --p1:#231f38; --p2:#17291f; --p3:#2e2217; --p4:#172433; --p5:#2c2814;
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
a{color:inherit}
button{font-family:inherit}
.num,.px,.tile-v,td.num{font-variant-numeric:tabular-nums}

/* 레이아웃: 데스크톱은 왼쪽 사이드바, 모바일은 위쪽 가로 탭 */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 8px;letter-spacing:-.02em}
.brand .logo{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .logo svg{width:17px;height:17px}
nav.tabs{display:flex;flex-direction:column;gap:4px}
nav.tabs button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:15px;font-weight:600;border:0;background:none;color:var(--sub);padding:11px 12px;border-radius:12px;cursor:pointer}
nav.tabs button svg{width:19px;height:19px;flex:none}
nav.tabs button:hover{background:var(--soft);color:var(--ink)}
nav.tabs button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
.side-meta{margin-top:auto;font-size:12px;color:var(--faint);line-height:1.55;padding:0 8px}
.side-meta b{color:var(--sub);font-weight:600}
.content{min-width:0;padding:26px 32px 0;max-width:1180px;width:100%}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.hello{font-size:14px;color:var(--sub);font-weight:500}
header.top h1{font-size:26px;margin:2px 0 0;letter-spacing:-.03em;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);background:var(--card);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.meta select{font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border:0;border-radius:999px;background:var(--card);color:var(--ink)}
main{padding-bottom:8px}
section.tab{display:none}
section.tab.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

h2{font-size:19px;font-weight:700;margin:30px 0 12px;letter-spacing:-.02em}
h2:first-child{margin-top:4px}
.card{background:var(--card);border-radius:var(--radius);padding:20px 22px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--sub)}
.small{font-size:13px}
.fail{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:14px;margin-bottom:12px}
.note{background:var(--card);border-radius:14px;padding:11px 16px;font-size:13px;color:var(--sub);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--faint);font-weight:600}
td.num{text-align:right;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--flat-bg);color:var(--flat);margin:0 4px 4px 0;white-space:nowrap;line-height:1.4}
.chip.up{background:var(--up-bg);color:var(--up)} .chip.down{background:var(--down-bg);color:var(--down)}
.chip.dup{background:var(--accent);color:var(--accent-ink)}
.chip.stock{background:var(--soft);color:var(--ink);font-weight:600}
.src{font-size:12px;color:var(--faint)}
.src a{color:var(--faint)}

/* 탭별 3줄 요약 */
.tabsum{background:var(--accent-soft);border-radius:var(--radius);padding:18px 22px;margin-bottom:22px}
.tabsum-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px}
.tabsum-h svg{width:15px;height:15px}
.tabsum ol{margin:0;padding-left:20px}
.tabsum li{margin:4px 0;font-size:15px;font-weight:500;line-height:1.6}
.tabsum li::marker{color:var(--accent);font-weight:700}

/* 관심 종목: 파스텔 카드 */
.stocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.scard{background:var(--card);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.watch .scard:nth-child(5n+1){background:var(--p1)} .watch .scard:nth-child(5n+2){background:var(--p2)}
.watch .scard:nth-child(5n+3){background:var(--p3)} .watch .scard:nth-child(5n+4){background:var(--p4)} .watch .scard:nth-child(5n+5){background:var(--p5)}
.scard .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.scard .nm{font-weight:700;font-size:15px}
.scard .px{font-size:22px;font-weight:800;letter-spacing:-.02em}
.scard .px b{font-size:15px;font-weight:700;margin-left:4px}
.scard .px.muted{font-size:13px;font-weight:500}
.chart{height:170px;border-radius:12px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center}
.chart img{width:100%;height:100%;object-fit:contain;background:#fff}
.watch .chart{background:transparent}
.watch .chart img{background:transparent;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){ .watch .chart img{mix-blend-mode:normal;background:#fff;border-radius:10px} }
.mentions{font-size:12px;color:var(--sub);margin:0;padding-left:16px}
.mentions li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mentions li.more{list-style:none;margin-left:-16px;color:var(--faint)}

/* 관심 종목 소식: 토스식 목록 */
.wlist{list-style:none;margin:0;padding:0}
.wlist li{border-bottom:1px solid var(--line)}
.wlist li:last-child{border-bottom:0}
.wlist button.wrow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-radius:12px;padding:12px 10px;margin:0;text-align:left;color:var(--ink);font-size:14px;cursor:pointer}
.wlist button.wrow:hover{background:var(--soft);color:var(--ink)}
.wn{display:flex;flex-direction:column;line-height:1.35}
.wn b{font-size:15px}
.wt{display:flex;flex-wrap:wrap}
.wt .chip{margin-bottom:2px}
.wp{text-align:right;font-weight:700;line-height:1.35;white-space:nowrap}
@media (max-width:640px){ .wlist button.wrow{grid-template-columns:1fr auto} .wt{grid-column:1 / -1;order:3} }


/* 관심 종목 한 줄: 이름 | 3개월 미니차트 | 오늘 언급 | 시세 */
.wlist button.wrow{grid-template-columns:minmax(90px,140px) 120px minmax(0,1fr) auto}
.wmini{display:block;width:120px;height:46px;border-radius:8px;overflow:hidden;background:transparent}
.wmini img{width:100%;height:100%;object-fit:cover;object-position:left center;mix-blend-mode:multiply}
.wmini.chart{display:block}
@media (prefers-color-scheme: dark){ .wmini img{mix-blend-mode:normal;background:#fff} }
@media (max-width:640px){ .wlist button.wrow{grid-template-columns:1fr 96px auto} .wmini{width:96px} .wt{grid-column:1 / -1;order:4} }
/* 지표 타일 미니차트 */
.tile-ch{height:56px;margin:6px 0 2px;border-radius:8px;overflow:hidden}
.tile-ch img{width:100%;height:100%;object-fit:cover;object-position:right center;mix-blend-mode:multiply}
.tile-ch.chart{display:block;background:transparent}
@media (prefers-color-scheme: dark){ .tile-ch img{mix-blend-mode:normal;background:#fff} }
.tile-note{font-size:11px;color:var(--faint)}
.chip.rep{background:var(--accent-soft);color:var(--accent)}

/* 주요 지표: 토스식 타일 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.tile{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-n{font-size:13px;color:var(--sub);font-weight:600}
.tile-v{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.tile-c{font-size:14px;font-weight:700}
.tile .src{margin-top:6px;line-height:1.45}

/* 이슈·뉴스·리포트 목록 */
.issue{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.issue .no{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px}
.issue h3,.news h3,.report h3{font-size:16px;margin:0 0 6px;line-height:1.45;font-weight:700;letter-spacing:-.02em}
.issue p,.news p{margin:0 0 8px;color:var(--ink)}
.impact{font-size:14px;background:var(--soft);border-radius:12px;padding:10px 14px;color:var(--sub);margin:10px 0 8px}
.impact b{color:var(--ink)}
.sched{list-style:none;margin:0;padding:0}
.sched li{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.sched li:last-child{border-bottom:0}
.sched .d{flex:0 0 118px;font-size:13px;font-weight:700;color:var(--accent)}
.sched .e{flex:1;min-width:0}
.sector-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sector-head h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.mood{margin:6px 0 14px;font-size:14px;color:var(--sub)}
.news{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.news:first-of-type{border-top:0;margin-top:0;padding-top:0}
.news h3 .chip{vertical-align:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp-list{list-style:none;margin:0;padding:0}
.tp-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tp-list li:last-child{border-bottom:0}
.report ul{margin:6px 0 10px;padding-left:18px}
.report li{margin:3px 0}
.rmeta{font-size:13px;color:var(--sub);margin-bottom:6px}

/* 유튜브: 채널 하위 탭(채널별 색), 영상 카드, 지난 영상 접기 */
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.subtab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:8px 15px;border-radius:999px;border:0;background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.subtab .cdot{width:8px;height:8px;border-radius:50%}
.subtab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.subtab .cnt{font-weight:500;opacity:.7}
.chpanel{border-top:4px solid var(--ch,var(--accent))}
.vcard{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.vcard:first-of-type{border-top:0;margin-top:0;padding-top:0}
details.old>summary{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--sub);padding:10px 0 2px}
details.old>summary::-webkit-details-marker{display:none}
details.old>summary::before{content:"▸ ";color:var(--faint)}
details.old[open]>summary::before{content:"▾ "}
.insight{margin:8px 0 10px;padding:12px 14px 12px 32px;font-size:14px;background:var(--soft);border-radius:12px}
.insight li{margin:2px 0}
.vstocks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vgroup{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.vlabel{font-size:12px;font-weight:700;margin-right:6px}
button.sbtn{font-size:12px;border:0;cursor:pointer;margin:0 4px 4px 0;transition:background .12s}
button.sbtn:hover{background:var(--accent-soft);color:var(--accent)}
.sbtn.is-dup{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* 종목 팝업 */
dialog#stockdlg{border:0;padding:0;background:transparent;color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog#stockdlg::backdrop{background:rgba(10,10,20,.5);backdrop-filter:blur(2px)}
dialog#stockdlg .close{position:absolute;top:12px;right:14px;border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--sub);cursor:pointer;z-index:1}
dialog#stockdlg .scard{position:relative;padding:22px 22px 18px;border-radius:22px}
dialog#stockdlg .scard .top{padding-right:36px}
dialog#stockdlg .chart{height:260px}
dialog#stockdlg .chart.tvov{height:340px;background:transparent}
dialog#stockdlg .chart.ec{height:320px;background:transparent;display:block}
.periods,.ecperiods{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:3px;align-self:flex-start}
.ecperiods button,.periods button{font-size:13px;font-weight:600;padding:5px 12px;border-radius:9px;border:0;background:transparent;color:var(--sub);cursor:pointer}
.periods button[aria-pressed=true],.ecperiods button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* AI 인사이트 탭: 대시보드 공통 밝은 테마(토스·Fox 스타일)를 따른다. 정보 밀도만 높게 */
.term{--tpanel:var(--card);--tline:var(--line);--tink:var(--ink);--tsub:var(--sub);--tamber:var(--accent);--tup:var(--up);--tdown:var(--down);--tgreen:#12b886;
  color:var(--ink);font-size:13px;line-height:1.5}
.term a{color:var(--ink)}
.thead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.tt1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.tsub{color:var(--sub);font-size:12px}
.tnote{background:var(--card);border-radius:14px;padding:10px 14px;color:var(--sub);font-size:12.5px;margin-bottom:12px;box-shadow:var(--shadow)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tp{background:var(--card);border-radius:var(--radius);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.tp.span2{grid-column:span 2} .tp.span3{grid-column:1 / -1}
.tp.accent{background:var(--accent-soft)}
.tph{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--accent)}
.tscroll{overflow-x:auto}
.tt{width:100%;border-collapse:collapse;font-size:13px}
.tt th{font-size:11.5px;color:var(--faint);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tt tr:last-child td{border-bottom:0}
.tt tr.hot td{background:var(--accent-soft)}
.tt td.tn{font-variant-numeric:tabular-nums;white-space:nowrap}
.tsrc{font-size:11px;color:var(--faint)!important;text-decoration:underline dotted;white-space:nowrap}
.tkind{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--down-bg);color:var(--down);white-space:nowrap}
.tkind.media{background:#fff3e0;color:#b25e09} .tkind.unk{background:var(--soft);color:var(--sub)} .tkind.new,.tkind.rev{background:#e3f7ec;color:#12875a}
.tkind.prod{background:#fff3e0;color:#b25e09} .tkind.tech{background:var(--down-bg);color:var(--down)}
@media (prefers-color-scheme: dark){ .tkind.media,.tkind.prod{background:#3a2a12;color:#f5b041} .tkind.new,.tkind.rev{background:#133526;color:#4cd39a} }
.tdir{display:inline-block;font-weight:800;min-width:1.2em}
.tdir.up{color:var(--up)} .tdir.down{color:var(--down)} .tdir.flat{color:var(--sub)}
.tlist{margin:0;padding-left:16px}
.tlist li{margin:0 0 9px}
.thesis{background:var(--soft);border-radius:12px;padding:10px 14px;margin-top:10px}
.tq{font-size:11.5px;color:var(--sub);font-weight:600} .tv{font-size:20px;font-weight:800;margin:2px 0 6px}
.tchain{list-style:none;margin:0;padding:0}
.tchain li{display:flex;gap:10px;padding:6px 0;position:relative}
.tchain li+li::before{content:"↓";position:absolute;left:4px;top:-9px;color:var(--faint);font-size:11px}
.tchain .cs{flex:none;font-size:14px}
.ttop{margin:0;padding-left:20px;font-size:14.5px;font-weight:600} .ttop li{margin:5px 0}
.ttop li::marker{color:var(--accent);font-weight:800}
.tcat{list-style:none;margin:0;padding:0} .tcat li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)} .tcat li:last-child{border-bottom:0}
.tcat .cd{flex:0 0 74px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.tsources{margin-top:14px;font-size:11.5px;color:var(--faint);line-height:1.8} .tsources a{color:var(--faint)}
.aisubs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px}
.aisub{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;padding:8px 15px;border-radius:999px;border:0;background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.aisub[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tins{list-style:none;margin:0;padding:0}
.tins li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)} .tins li:last-child{border-bottom:0}
.tins .is{font-size:17px;flex:none}
.tins b{font-size:15px}
.tcause,.timpact{font-size:13px;margin-top:4px}
.tl{display:inline-block;font-size:10.5px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:999px;padding:1px 8px;margin-right:6px}
.timpact .tl{color:var(--accent);background:var(--card)}
.tflow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.tfn{display:flex;flex-direction:column;gap:2px;background:var(--soft);border-radius:12px;padding:10px 12px;min-width:120px;flex:1}
.tfn b{font-size:12.5px} .tfn .tsub{font-size:11.5px}
.tfa{align-self:center;color:var(--faint)}
.tmap{font-size:13px} .tmn{padding:3px 0} .tma{color:var(--faint);padding-left:4px} .tmb div{padding:3px 0 3px 4px}
.tbox{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.tbox .tq{color:var(--accent);font-weight:700;margin-bottom:2px}
.tbig{font-size:15px;font-weight:600;margin:0;line-height:1.6}
.titem{padding:12px 0;border-bottom:1px solid var(--line)} .titem:last-of-type{border-bottom:0}
.tih{margin-bottom:6px}
.tstage{display:flex;flex-wrap:wrap;gap:4px}
.tstage span{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--faint)}
.tstage span.done{background:#e3f7ec;color:#12875a} .tstage span.on{background:var(--accent);color:var(--accent-ink);font-weight:800}
@media (prefers-color-scheme: dark){ .tstage span.done{background:#133526;color:#4cd39a} }
@media (max-width:1100px){ .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .tp.span2{grid-column:1 / -1} }
@media (max-width:700px){ .tgrid{grid-template-columns:1fr} .tp.span2,.tp.span3{grid-column:auto} .tp{padding:14px} }

/* 요약 속 강조: **중요** → 보라 굵게, {+상승+} → 빨강, {-하락-} → 파랑 */
b.hl{color:var(--accent);font-weight:800}
b.up,b.down{font-weight:800}
/* 액션 플랜 */
.actplan{background:var(--card);border-radius:var(--radius);padding:16px 22px;margin:-12px 0 22px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.actplan-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
.actplan-h svg{width:15px;height:15px;color:var(--accent)}
.actplan ol{margin:0;padding-left:20px}
.actplan li{margin:4px 0;font-size:15px;line-height:1.6}
.actplan li::marker{color:var(--accent);font-weight:800}
.term .actplan{margin:0}
.focus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.focus>div{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0;position:relative}
.focus>div:first-child::after{content:"→";position:absolute;right:-9px;top:50%;transform:translateY(-50%);z-index:1;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center}
.focus>div:nth-child(2){background:var(--accent-soft)}
.focus dt{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:2px}
.focus dd{margin:0;font-size:14px;line-height:1.55}
@media (max-width:760px){ .focus{grid-template-columns:1fr} .focus>div:first-child::after{content:"↓";right:auto;left:50%;top:auto;bottom:-9px;transform:translateX(-50%)} }
.disclaim{font-size:11.5px;color:var(--faint);margin:10px 2px 0}
/* 새로고침 */
.rbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.rbtn svg{width:15px;height:15px}
.rbtn[disabled]{opacity:.6;cursor:progress}
.rbtn[disabled] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
/* AI 인사이트(형식 2): 유망주·ETF·대표 기업 */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pick{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .rk{font-size:12px;font-weight:800;color:var(--accent)}
.pick .pp{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.pick .pp b{font-size:13px;margin-left:4px}
.pick p{margin:0;font-size:13px;line-height:1.55}
.stars{color:#f59f00;letter-spacing:1px;font-size:13px;white-space:nowrap}
.etfs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.etf{background:var(--soft);border-radius:14px;padding:12px 14px;min-width:0}
.etf .chart{height:110px;margin-top:6px;background:transparent}
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lgrp{background:var(--soft);border-radius:14px;padding:10px 12px}
.lgrp h4{margin:0 0 4px;font-size:13px;color:var(--accent)}
.lrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow .chip{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pick .chip{align-self:flex-start;font-size:14px}
.lpx{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:700px){ .etfs{grid-template-columns:1fr} }

footer{margin-top:34px;padding:22px 0 44px;border-top:1px solid var(--line)}
.srclist{columns:2;font-size:13px;padding-left:18px;color:var(--sub)}
.srclist li{break-inside:avoid;margin-bottom:3px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand span.txt,.side-meta{display:none}
  .brand{padding:0}
  nav.tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px}
  nav.tabs button{width:auto;flex:0 0 auto;padding:8px 12px;font-size:14px;border-radius:999px}
  nav.tabs button svg{display:none}
  .content{padding:18px 16px 0}
  header.top h1{font-size:22px}
}
@media (max-width:640px){
  .cols{grid-template-columns:1fr}
  .srclist{columns:1}
  .hide-m{display:none}
  .card{padding:16px 16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile-v{font-size:18px}
  .sched .d{flex-basis:92px}
  .issue{grid-template-columns:1fr}
  .issue .no{display:none}
}

/* ── 테마(⚙ 설정에서 고름): A 잉크·청록 / D 네이비·골드 / E 오로라 글래스 / H 노션 웜 ── */
html[data-theme="A"]{--bg:#f4f5f7; --card:#fff; --ink:#0f1419; --sub:#5b6573; --faint:#8a94a3; --line:#e5e8ec; --soft:#f3f5f7;

  --side:#0f1419; --side-ink:#eef1f4; --side-sub:#8b95a3; --side-hover:#1a2028;
  --hero:#0f1419; --hero-ink:#eef1f4; --hero-sub:#9aa4b2; --hero-up:#ff6b78; --hero-down:#6aa8ff; --hero-accent:#5eead4;}
@media (prefers-color-scheme: dark){html[data-theme="A"]{--bg:#0a0c0f; --card:#12161b; --ink:#e8ebef; --sub:#9aa4b2; --faint:#6b7480; --line:#232931; --soft:#181d24;
  --accent:#2dd4bf; --accent-ink:#04201d; --accent-soft:#0e2826;

  --hero:#161c23; --hero-ink:#eef1f4; --hero-sub:#9aa4b2;}}
html[data-theme="A"] body{letter-spacing:-.015em}

html[data-theme="A"] .brand{color:var(--side-ink)}
html[data-theme="A"] nav.tabs button{color:var(--side-sub)}
html[data-theme="A"] nav.tabs button:hover{background:var(--side-hover);color:var(--side-ink)}
html[data-theme="A"] nav.tabs button[aria-selected=true]{background:var(--side-hover);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--accent)}
html[data-theme="A"] nav.tabs button[aria-selected=true] svg{color:var(--accent)}
html[data-theme="A"] .side-meta{color:var(--side-sub)}

@media (max-width:900px){html[data-theme="A"] .side{border-bottom:0}

html[data-theme="A"] .meta select{border:1px solid var(--line);background:var(--card)}

html[data-theme="A"] .card,html[data-theme="A"] .tile,html[data-theme="A"] .scard,html[data-theme="A"] .tp,html[data-theme="A"] .note,html[data-theme="A"] .tnote,html[data-theme="A"] .actplan,html[data-theme="A"] .subtab,html[data-theme="A"] .aisub{border:1px solid var(--line);box-shadow:none}

html[data-theme="A"] .tabsum b.hl,html[data-theme="A"] .tp.accent b.hl{color:var(--hero-accent)}

html[data-theme="A"] .focus>div:nth-child(2){background:var(--accent-soft)}
html[data-theme="D"]{--bg:#f7f5f0;--card:#fff;--ink:#14213d;--sub:#5c6478;--faint:#8e94a3;--line:#e8e3d8;--soft:#f3efe6;
  --accent:#b8892d;--accent-ink:#fff;--accent-soft:#f6eedc;--p1:#fff;--p2:#fff;--p3:#fff;--p4:#fff;--p5:#fff;

html[data-theme="E"]{--bg:#f6f5fb;--card:rgba(255,255,255,.7);--ink:#1b1736;--sub:#5d5a78;--faint:#8c89a6;--line:rgba(120,110,180,.18);--soft:rgba(255,255,255,.55);
  --accent:#7c3aed;--accent-ink:#fff;--accent-soft:rgba(124,58,237,.1);--p1:rgba(255,255,255,.7);--p2:rgba(255,255,255,.7);--p3:rgba(255,255,255,.7);--p4:rgba(255,255,255,.7);--p5:rgba(255,255,255,.7);
  --radius:20px;--shadow:0 8px 30px rgba(60,40,140,.08)}
html[data-theme="E"] body{background:radial-gradient(1000px 600px at 5% -10%,#e7d9ff 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#d3ecff 0,transparent 55%),radial-gradient(700px 500px at 60% 110%,#ffe3f1 0,transparent 60%),#f6f5fb;background-attachment:fixed}

/* 테마 고르기(⚙) */
.gbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.gbtn svg{width:17px;height:17px}
.themepop{position:fixed;z-index:30;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);width:min(320px,calc(100vw - 32px))}
.themepop h4{margin:0 0 10px;font-size:13px;color:var(--sub)}
.themepop .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themepop button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--soft);border:2px solid transparent;border-radius:12px;padding:10px;cursor:pointer}
.themepop button[aria-pressed=true]{border-color:var(--accent)}
.themepop .sw{display:flex;gap:3px} .themepop .sw i{width:18px;height:18px;border-radius:5px;display:block;border:1px solid rgba(0,0,0,.08)}
.themepop small{font-weight:500;color:var(--sub);font-size:11.5px}

/* ── Next 섹터 탐색(S-Curve) ── */
.nx-top{list-style:none;padding:0;margin:0}
.nx-top li{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(127,127,127,.18)}
.nx-top li:first-child{border-top:0}
.nx-top .k{font-size:12.5px;font-weight:700;opacity:.85}
.nx-grp{display:flex;align-items:center;gap:8px;margin:26px 0 10px;font-size:16px;font-weight:800}
.nx-grp .small{font-weight:500}
.nx-stage{display:flex;gap:3px;margin:10px 0 4px}
.nx-stage span{flex:1;font-size:10.5px;text-align:center;padding:4px 2px;border-radius:6px;background:var(--flat-bg);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx-stage span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.nx-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.nx-kv div{background:var(--flat-bg);border-radius:10px;padding:9px 11px;font-size:13px}
.nx-kv b{display:block;font-size:11px;color:var(--faint);font-weight:600;margin-bottom:3px}
.nx-p{font-size:13.5px;margin:6px 0}
.nx-p b{color:var(--sub);font-weight:700;margin-right:4px}
.nx-cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:12px}
.nx-co{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.nx-co.hot{border-color:var(--up)}
.nx-co .hd{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.nx-co .px{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;margin-bottom:6px}
.nx-co dl{margin:0;display:grid;grid-template-columns:62px 1fr;gap:4px 8px}
.nx-co dt{color:var(--faint);font-size:11.5px;font-weight:600}
.nx-co dd{margin:0}
.nx-score{font-weight:800;font-variant-numeric:tabular-nums}
.nx-bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-left:6px}
.nx-chg{border-left:3px solid var(--accent)}
.nx-src{font-size:12px;color:var(--faint);margin-top:8px}
.nx-src a{color:var(--faint)}
@media (max-width:640px){.nx-kv{grid-template-columns:1fr}.nx-top li{grid-template-columns:1fr;gap:2px}}


.nx-ic{display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);flex:none;background:var(--accent-soft);color:var(--accent)}
.nx-ic svg{width:60%;height:60%}
.nx-ic.g-green{background:rgba(18,184,134,.14);color:#0f9f74}
.nx-ic.g-yellow{background:rgba(245,159,0,.15);color:#c77d00}
.nx-ic.g-blue{background:rgba(49,130,246,.13);color:#2f6fd6}
.nx-h{display:flex;align-items:center;gap:10px}
.nx-cell{display:inline-flex;align-items:center;gap:6px}
/* ── 경제 시황 벤토 그리드 ── */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;grid-auto-flow:dense;margin-bottom:14px}
.bento .tile{border-radius:var(--radius);margin:0}
.bento .b-big{grid-column:span 2;grid-row:span 2;padding:20px 22px}
.bento .b-big .tile-v{font-size:44px;line-height:1.1;letter-spacing:-.04em;margin-top:4px}
.bento .b-big .tile-c{font-size:16px}
.bento .b-big .tile-ch{height:150px;margin-top:auto}
.bento .b-sum{grid-column:span 2;grid-row:span 2;margin:0;display:flex;flex-direction:column}

const pct = v => v == null ? "" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;
const fmtNum = n => n == null ? "–" : Number(n).toLocaleString("ko-KR");
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("ko-KR", {timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}); };
const tagCls = t => t === "호재" ? "up" : t === "악재" ? "down" : "";
const ctxCls = t => t === "긍정" ? "up" : t === "부정" ? "down" : "";

/* AI 인사이트에만 나오는 종목(형식 2)은 EXTRA에 넣어 두고 팝업에서도 찾는다 */
let EXTRA = {};
function stockOf(ref) {
  if (ref && typeof ref === "object") return ref.ticker ? (D.stocks[ref.ticker] || EXTRA[ref.ticker]) : {name: ref.name, ticker: null, note: ref.note};
  return D.stocks[ref] || EXTRA[ref] || {name: ref, ticker: null};
}
function stockLabel(s) {
  return s.ticker ? `${s.name} / ${s.ticker} / ${s.market}` : `${s.name} / ${s.note ? s.note : "티커 확인 필요"}`;
}
/* 티커가 있는 종목은 누르면 차트·시세 카드가 팝업으로 뜬다 */
function stockBtn(s, cls = "") {
  return s.ticker
    ? `<button type="button" class="chip stock sbtn ${cls}" data-t="${esc(s.ticker)}">${esc(stockLabel(s))}</button>`
    : `<span class="chip stock ${cls}">${esc(stockLabel(s))}</span>`;
}
/* 좁은 칸용: 이름만 보이고 티커·시장은 툴팁으로 */
function nameBtn(s) {
  return s.ticker
    ? `<button type="button" class="chip stock sbtn" data-t="${esc(s.ticker)}" title="${esc(stockLabel(s))}">${esc(s.name)}</button>`
    : `<span class="chip stock" title="${esc(stockLabel(s))}">${esc(s.name)}</span>`;
}
function stockChips(list) {
  return (list || []).map(r => stockBtn(stockOf(r))).join("");
}

/* 종목별 언급 출처(탭3 리포트명, 탭4 영상명) */
function mentionMap() {
  const m = {};
  const add = (t, label) => { if (!t) return; (m[t] = m[t] || []).push(label); };
  D.tab3.reports.forEach(r => (r.stocks || []).forEach(t => add(typeof t === "string" ? t : t.ticker, `리포트: ${r.broker} 「${r.title}」`)));
  D.tab4.channels.forEach(ch => (ch.videos || []).forEach(v => (v.stocks || []).forEach(s => add(s.stock, `영상: ${ch.name} 「${v.title}」 (${s.context})`))));
  return m;
}

/* 네이버 금융 차트 이미지(국내). 1개월·6개월 이미지는 제공되지 않음 */
const KRX_PERIODS = [["candle/day", "3개월"], ["area/year", "1년"], ["area/year3", "3년"]];
const naverImg = (t, p) => `https://ssl.pstatic.net/imgfinance/chart/item/${p}/${t}.png`;
const naverPeriodsHtml = t => `<div class="periods" data-t="${esc(t)}">${KRX_PERIODS.map(([p, nm], i) =>
  `<button type="button" data-p="${p}" aria-pressed="${i === 0}">${nm}</button>`).join("")}</div>
  <div class="chart"><img alt="차트" src="${naverImg(esc(t), KRX_PERIODS[0][0])}"></div>`;

/* 국내 종목 캔들 차트: market/charts/코드.js(공공데이터포털 일봉)를 스크립트로 읽어 ECharts로 그린다.
   파일이 없으면 네이버 차트 이미지로 대신한다. file:// 로 열어도 되도록 fetch 대신 <script>를 쓴다. */
const EC_PERIODS = [[1, "1개월"], [3, "3개월"], [6, "6개월"], [12, "1년"], [36, "3년"]];
const chartData = {}, chartWaiters = {};
window.__chartLoaded = meta => { chartData[meta.code] = meta; (chartWaiters[meta.code] || []).forEach(f => f(meta)); };
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error(src)); document.head.appendChild(s); });
}
let echartsReady = null;
const loadECharts = () => echartsReady || (echartsReady = loadScript("https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js").then(() => window.echarts));
function loadChartData(code) {
  if (chartData[code]) return Promise.resolve(chartData[code]);
  return new Promise((ok, fail) => {
    (chartWaiters[code] = chartWaiters[code] || []).push(ok);
    loadScript(`market/charts/${code}.js`).catch(fail);
  });
}
const ma = (closes, n) => closes.map((_, i) => i + 1 < n ? null : Math.round(closes.slice(i + 1 - n, i + 1).reduce((a, b) => a + b, 0) / n));
function zoomToMonths(inst, dates, months) {
  const last = new Date(dates[dates.length - 1]); last.setMonth(last.getMonth() - months);
  const from = last.toISOString().slice(0, 10);
  const i = Math.max(0, dates.findIndex(d => d >= from));
  inst.dispatchAction({type: "dataZoom", startValue: i, endValue: dates.length - 1});
}
async function mountEC(wrap) {
  const code = wrap.dataset.t, box = wrap.querySelector(".chart.ec");
  let meta, ec;
  try { [meta, ec] = await Promise.all([loadChartData(code), loadECharts()]); }
  catch (e) { wrap.outerHTML = naverPeriodsHtml(code); return; }
  if (!meta.rows.length) { wrap.outerHTML = naverPeriodsHtml(code); return; }
  const css = getComputedStyle(document.documentElement);
  const up = css.getPropertyValue("--up").trim(), down = css.getPropertyValue("--down").trim();
  const sub = css.getPropertyValue("--sub").trim(), line = css.getPropertyValue("--line").trim();
  const dates = meta.rows.map(r => r[0]), closes = meta.rows.map(r => r[4]);
  box.innerHTML = "";
  const inst = ec.init(box, null, {renderer: "canvas"});
  const maLine = (n, color) => ({name: `${n}일`, type: "line", data: ma(closes, n), symbol: "none", smooth: false, lineStyle: {width: 1, color}, z: 2});
  inst.setOption({
    animation: false,
    legend: {data: ["5일", "20일", "60일", "120일"], top: 0, left: 0, itemWidth: 12, itemHeight: 2, textStyle: {color: sub, fontSize: 10}},
    tooltip: {trigger: "axis", axisPointer: {type: "cross"}, textStyle: {fontSize: 12},
      formatter: ps => { const i = ps[0].dataIndex, r = meta.rows[i];
        return `${r[0]}<br>시가 ${r[1].toLocaleString()} · 고가 ${r[2].toLocaleString()}<br>저가 ${r[3].toLocaleString()} · 종가 <b>${r[4].toLocaleString()}</b><br>거래량 ${r[5].toLocaleString()}`; }},
    axisPointer: {link: [{xAxisIndex: "all"}]},
    grid: [{left: 8, right: 56, top: 24, height: "62%"}, {left: 8, right: 56, top: "78%", height: "16%"}],
    xAxis: [{type: "category", data: dates, boundaryGap: true, axisLine: {lineStyle: {color: line}}, axisLabel: {color: sub, fontSize: 10}},
            {type: "category", data: dates, gridIndex: 1, axisLabel: {show: false}, axisTick: {show: false}, axisLine: {lineStyle: {color: line}}}],
    yAxis: [{scale: true, position: "right", splitLine: {lineStyle: {color: line}}, axisLabel: {color: sub, fontSize: 10, formatter: v => v.toLocaleString()}},
            {scale: true, gridIndex: 1, position: "right", splitNumber: 2, axisLabel: {show: false}, splitLine: {show: false}}],
    dataZoom: [{type: "inside", xAxisIndex: [0, 1]}],
    series: [
      {name: "일봉", type: "candlestick", data: meta.rows.map(r => [r[1], r[4], r[3], r[2]]),
       itemStyle: {color: up, color0: down, borderColor: up, borderColor0: down}},
      maLine(5, "#f59e0b"), maLine(20, "#8b5cf6"), maLine(60, "#10b981"), maLine(120, "#94a3b8"),
      {name: "거래량", type: "bar", xAxisIndex: 1, yAxisIndex: 1,
       data: meta.rows.map(r => ({value: r[5], itemStyle: {color: r[4] >= r[1] ? up : down, opacity: .6}}))}
    ]
  });
  zoomToMonths(inst, dates, 3);
  wrap.querySelector(".ecsrc").textContent = `자료: ${meta.source} · ${dates[dates.length - 1]}까지(1영업일 지연) · 휠·드래그로 확대/이동`;
  wrap._ec = {inst, dates};
  new ResizeObserver(() => inst.resize()).observe(box);
}

function stockCard(t, mentions, big = false) {
  const s = stockOf(t);
  const dup = (D.dup_mentions || []).includes(s.ticker);
  let chart;
  if (!s.ticker) chart = `<div class="chart muted small">티커 확인 필요 — 차트 미연결</div>`;
  else if (s.market === "KRX" && big) chart = `<div class="ecwrap" data-t="${esc(s.ticker)}" data-name="${esc(s.name)}">
      <div class="ecperiods">${EC_PERIODS.map(([m, nm]) => `<button type="button" data-m="${m}" aria-pressed="${m === 3}">${nm}</button>`).join("")}</div>
      <div class="chart ec"><span class="muted small">차트를 불러오는 중…</span></div>
      <div class="src ecsrc"></div></div>`;
  else if (s.market === "KRX") chart = `<div class="chart"><img loading="lazy" alt="${esc(s.name)} 일봉 차트" src="${naverImg(esc(s.ticker), "candle/day")}"></div>`;
  else if (big) chart = `<div class="chart tv tvov" data-symbol="${esc(s.market + ":" + s.ticker)}"></div>`;
  else chart = `<div class="chart tv" data-symbol="${esc(s.market + ":" + s.ticker)}"></div>`;
  const px = s.price || s.change_pct != null
    ? `<span class="px">${esc(fmtPx(s.price))} <b class="${dirCls(s.change_pct)}">${pct(s.change_pct)}</b></span>`
    : `<span class="px muted small">${s.market && s.market !== "KRX" ? "시세는 차트 위젯 참고" : "시세 미조회"}</span>`;
  const basis = s.price_source ? `<div class="src">${s.price_as_of ? esc(s.price_as_of) + " · " : ""}${link(s.price_source, s.price_url)}${s.market === "KRX" ? " · 차트: 네이버 금융 일봉" : ""}</div>` : (s.market === "KRX" ? `<div class="src">차트: 네이버 금융 일봉</div>` : "");
  const ms = (mentions && mentions[s.ticker]) || [];
  return `<div class="scard">
    <div class="top"><span class="nm">${esc(stockLabel(s))}</span>${dup ? `<span class="chip dup">중복 언급</span>` : ""}</div>
    ${px}${chart}${basis}
    ${ms.length ? `<ul class="mentions">${ms.slice(0, ms.length > 5 ? 4 : 5).map(x => `<li title="${esc(x)}">${esc(x)}</li>`).join("")}${ms.length > 5 ? `<li class="more">외 ${ms.length - 4}건</li>` : ""}</ul>` : ""}
  </div>`;
}

/* TradingView 미니 차트: 탭이 보일 때 한 번만 그린다(숨은 탭에서는 크기가 0이 됨) */
function mountCharts(root) {
  root.querySelectorAll(".chart.tv:not([data-done])").forEach(el => {
    el.dataset.done = "1";
    el.innerHTML = `<div class="tradingview-widget-container" style="width:100%;height:100%"><div class="tradingview-widget-container__widget"></div></div>`;
    const sc = document.createElement("script");
    sc.async = true;
    if (el.classList.contains("tvov")) {  // 팝업: 기간 버튼(1개월~3년)이 있는 위젯
      sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
      sc.textContent = JSON.stringify({symbols: [[el.dataset.symbol + "|3M"]], dateRanges: ["1m|30", "3m|60", "12m|1D", "36m|1W"],
        chartOnly: false, showVolume: false, width: "100%", height: "100%", locale: "kr", colorTheme: isDark() ? "dark" : "light", isTransparent: true, autosize: true});
    } else {
      sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
      sc.textContent = JSON.stringify({symbol: el.dataset.symbol, width: "100%", height: "100%", locale: "kr", dateRange: "3M", colorTheme: isDark() ? "dark" : "light", isTransparent: true, autosize: true, chartOnly: el.classList.contains("mini"), noTimeScale: el.classList.contains("mini")});
    }
    el.firstChild.appendChild(sc);
  });
}

/* 관심 종목 소식: 관심 종목이 오늘 뉴스·리포트·유튜브에 어떻게 나왔는지 모아 본다 */
/* 관심 종목: 시세·미니차트·오늘 언급을 한 줄에 합친 목록(토스식). 줄을 누르면 차트 팝업 */
function watchList() {
  const list = D.watchlist.stocks || [];
  if (!list.length) return "";
  const has = (arr, t) => (arr || []).some(x => (typeof x === "string" ? x : x && x.ticker) === t);
  const rows = list.map(t => {
    const s = stockOf(t);
    let pos = 0, neg = 0, news = 0, rep = 0;
    D.tab2.sectors.forEach(sec => sec.news.forEach(n => { if (has(n.stocks, t)) news++; }));
    D.tab3.reports.forEach(r => { if (has(r.stocks, t)) rep++; });
    D.tab4.channels.forEach(ch => ch.videos.forEach(v => (v.stocks || []).forEach(x => { if (x.stock === t) { if (x.context === "긍정") pos++; else if (x.context === "부정") neg++; } })));
    const tags = [pos && `<span class="chip up">유튜브 긍정 ${pos}</span>`, neg && `<span class="chip down">유튜브 부정 ${neg}</span>`,
                  news && `<span class="chip">뉴스 ${news}</span>`, rep && `<span class="chip">리포트 ${rep}</span>`].filter(Boolean).join("");
    const mini = !s.ticker ? `<span class="wmini"></span>`
      : s.market === "KRX" ? `<span class="wmini"><img loading="lazy" alt="" src="${naverImg(esc(s.ticker), "area/month3")}"></span>`
      : `<span class="wmini chart tv mini" data-symbol="${esc(s.market + ":" + s.ticker)}"></span>`;
    return {html: `<li><button type="button" class="wrow sbtn" data-t="${esc(t)}">
        <span class="wn"><b>${esc(s.name)}</b><span class="src">${esc(s.ticker || "")}${(D.dup_mentions || []).includes(t) ? " · 중복 언급" : ""}</span></span>
        ${mini}
        <span class="wt">${tags || `<span class="src">오늘 언급 없음</span>`}</span>
        <span class="wp num">${esc(fmtPx(s.price) || "–")}<br><span class="${dirCls(s.change_pct)}">${pct(s.change_pct)}</span></span>
      </button></li>`, score: pos + neg + news + rep};
  }).sort((a, b) => b.score - a.score);
  const first = list.map(stockOf).find(s => s.price_as_of) || {};
  return `<h2>관심 종목</h2><div class="card" style="padding:6px 10px"><ul class="wlist">${rows.map(r => r.html).join("")}</ul>
    <div class="src" style="padding:6px 10px 8px">시세: ${esc(first.price_source || "–")}${first.price_as_of ? " · " + esc(first.price_as_of) : ""} · 미니차트: 3개월(네이버 금융) · 줄을 누르면 기간별 차트</div></div>`;
}

/* 주요 지표 미니차트: 코스피·코스닥은 네이버 장중 차트, 나머지는 TradingView(차트만) */
const IND_CHART = {
  "코스피": {img: "https://ssl.pstatic.net/imgfinance/chart/sise/siseMainKOSPI.png", note: "장중(최근 거래일)"},
  "코스닥": {img: "https://ssl.pstatic.net/imgfinance/chart/sise/siseMainKOSDAQ.png", note: "장중(최근 거래일)"},
  "S&P500": {tv: "FOREXCOM:SPXUSD"}, "나스닥": {tv: "FOREXCOM:NSXUSD", note: "차트는 나스닥100"}, "다우": {tv: "FOREXCOM:DJI"},
  "원/달러": {tv: "FX_IDC:USDKRW"}, "미 10년물 국채금리": {tv: "FRED:DGS10", note: "FRED 일별"}, "WTI (11월물)": {tv: "TVC:USOIL"},
  "금": {tv: "TVC:GOLD"}, "비트코인": {tv: "BITSTAMP:BTCUSD"},
};
function indChart(name) {
  const c = IND_CHART[name] || IND_CHART[Object.keys(IND_CHART).find(k => name.startsWith(k))];
  if (!c) return "";
  const box = c.img ? `<div class="tile-ch"><img loading="lazy" alt="${esc(name)} 차트" src="${c.img}"></div>` : `<div class="tile-ch chart tv mini" data-symbol="${esc(c.tv)}"></div>`;
  return box + (c.note ? `<span class="tile-note">${esc(c.note)}</span>` : "");
}

/* 경제 시황: 벤토 그리드(큰 코스피 타일 + 5줄 요약 + 작은 지표 타일 + 일정·Next TOP 타일) */
function renderT1() {
  const t = D.tab1;
  if (t.fail_reason) return `<div class="fail">오늘 수집 실패: ${esc(t.fail_reason)}</div>`;
  const dirc = i => i.dir === "up" ? "up" : i.dir === "down" ? "down" : "muted";
  const tile = (i, cls = "") => `<div class="tile ${cls}">
      <span class="tile-n">${esc(i.name)}</span>
      <span class="tile-v">${esc(i.value)}</span>
      <span class="tile-c ${dirc(i)}">${esc(i.change)}</span>
      ${indChart(i.name)}
      <span class="src">${esc(i.as_of)}${i.source ? ` · ${link(i.source, i.url)}` : ""}</span></div>`;
  const [hero, ...rest] = t.indicators;
  const lines = (D.tab_summaries || {}).t1 || [];
  const sum = lines.length ? `<div class="tabsum b-sum"><div class="tabsum-h">${SPARK}오늘의 ${lines.length}줄 요약</div><ol>${lines.map(x => `<li>${rich(x)}</li>`).join("")}</ol></div>` : "";
  const sched = (t.schedule || []).slice(0, 3);
  const schedTile = sched.length ? `<div class="tile b-wide b-list"><span class="tile-n">다가오는 일정</span>
      ${sched.map(x => `<div class="bl"><b>${esc(x.date)}</b><span>${esc(x.event)}</span></div>`).join("")}</div>` : "";
  const top = nxRank().top5.slice(0, 3);
  const nxTile = top.length ? `<div class="tile b-list b-nx"><span class="tile-n">Next 섹터 TOP 3 <button type="button" class="b-more" onclick="show('t6')">더보기 ›</button></span>
      ${top.map((c, i) => `<div class="bl"><b>${i + 1}</b><span>${esc(c.name)}<br><small class="muted nx-cell">${nxIcon(c.ind, 16)}${esc(c.ind.name)}</small></span><b class="tn">${nxTotal(c)}</b></div>`).join("")}</div>` : "";
  return `
  <div class="bento">
    ${hero ? tile(hero, "b-big") : ""}${sum}
    ${rest.map(i => tile(i)).join("")}
    ${schedTile}${nxTile}
  </div>
  ${actPlan((D.tab_actions || {}).t1, (D.tab_focus || {}).t1)}
  <p class="src" style="margin:6px 2px 0">미니차트는 열람 시점 흐름(3개월)입니다. 타일 숫자는 기사로 확인한 종가이며, 출처가 한국투자증권 Open API인 타일(코스피·코스닥)은 자동 갱신된 시세입니다.</p>
  ${watchList()}
  <h2>핵심 이슈</h2>
  ${t.issues.map((x, i) => `<div class="card issue"><span class="no">${i + 1}</span><div>
    <h3>${esc(x.title)}</h3><p>${esc(x.body)}</p>
    <div class="impact"><b>시장 영향</b> · ${esc(x.impact)}</div>
    <div class="src">출처: ${x.sources.map(s => link(s.name, s.url)).join(" · ")}</div></div></div>`).join("")}
  <h2>주요 일정</h2>
  <div class="card"><ul class="sched">${t.schedule.map(s => `<li><span class="d">${esc(s.date)}</span><span class="e">${esc(s.event)}<br><span class="src">${link(s.source, s.url)}</span></span></li>`).join("")}</ul></div>`;
}

function tpLine(x) {
  const s = stockOf(x.stock), u = x.unit || "원";
  return `<li>${stockBtn(s)} · ${esc(x.broker)}<br>
    <span class="small">${fmtNum(x.tp_old)} → ${fmtNum(x.tp_new)}${esc(u)} <b class="${dirCls(x.tp_change_pct)}">(${x.tp_change_pct > 0 ? "+" : ""}${x.tp_change_pct}%)</b></span></li>`;
}
function reportItem(r) {
  const tp = r.tp_new ? `${r.tp_old ? fmtNum(r.tp_old) + " → " : ""}${fmtNum(r.tp_new)}${esc(r.unit || "원")}${r.tp_change_pct != null ? ` <b class="${dirCls(r.tp_change_pct)}">(${r.tp_change_pct > 0 ? "+" : ""}${r.tp_change_pct}%)</b>` : ""}` : "";
  return `<div class="news report">
    <h3><span class="chip rep">리포트</span>${esc(r.title)}</h3>
    <div class="rmeta"><span class="chip">${esc(r.region)}</span>${esc(r.broker)}${r.analyst ? " · " + esc(r.analyst) : ""} · ${esc(r.date)}</div>

/* 섹터별 뉴스: 섹터 뉴스와 증권가 리포트를 섹터 기준으로 합친 탭 */
function renderT2() {
  const secs = D.tab2.sectors || [], t3 = D.tab3 || {reports: [], up: [], down: []};
  const names = secs.map(s => s.sector);
  const repOf = name => t3.reports.filter(r => (r.sector || "시장 전체") === name);
  const others = t3.reports.filter(r => !names.includes(r.sector || "시장 전체"));
  const tpBox = `<div class="cols">
    <div class="card"><h3 class="up" style="margin:0 0 6px;font-size:15px">목표가 상향 ${t3.up.length}</h3>
      ${t3.up.length ? `<ul class="tp-list">${t3.up.map(tpLine).join("")}</ul>` : `<div class="muted small">이번 기간 확인된 상향 없음</div>`}</div>
    <div class="card"><h3 class="down" style="margin:0 0 6px;font-size:15px">목표가 하향 ${t3.down.length}</h3>
      ${t3.down.length ? `<ul class="tp-list">${t3.down.map(tpLine).join("")}</ul>` : `<div class="muted small">이번 기간 확인된 하향 없음</div>`}</div>
  </div>${t3.note ? `<div class="note">${esc(t3.note)}</div>` : ""}
  ${(t3.econ_news || []).length ? `<div class="card">
    <div class="sector-head"><h3>최신 경제·증권 뉴스</h3><span class="small muted">${t3.reports.length ? "" : "새 증권가 리포트가 없어 "}시장 전체에 영향을 주는 뉴스</span></div>
    ${t3.econ_news.map(n => `<div class="news">
      <h3><span class="chip ${tagCls(n.tag)}">${esc(n.tag)}</span>${n.sector ? `<span class="chip">${esc(n.sector)}</span>` : ""}${esc(n.title)}</h3>
      <p>${esc(n.body)}</p>
      ${n.stocks && n.stocks.length ? `<div style="margin-bottom:4px">${stockChips(n.stocks)}</div>` : ""}
      <div class="src">${esc(n.date)} · ${link(n.source, n.url)}</div></div>`).join("")}
  </div>` : ""}`;
  const secCard = (title, mood, fail, news, reps) => {
    const tally = {호재: 0, 악재: 0, 중립: 0}; news.forEach(n => tally[n.tag]++);
    const empty = !news.length && !reps.length;
    return `<div class="card">
      <div class="sector-head"><h3>${esc(title)}</h3>
        <span>${Object.entries(tally).filter(([, v]) => v).map(([k, v]) => `<span class="chip ${tagCls(k)}">${k} ${v}</span>`).join("")}${reps.length ? `<span class="chip rep">리포트 ${reps.length}</span>` : ""}</span></div>
      ${mood ? `<div class="mood">${esc(mood)}</div>` : ""}
      ${empty && fail ? `<div class="fail" style="margin:10px 0 0">오늘 수집 실패: ${esc(fail)}</div>` : ""}
      ${news.map(n => `<div class="news">
        <h3><span class="chip ${tagCls(n.tag)}">${esc(n.tag)}</span>${esc(n.title)}</h3>
        <p>${esc(n.body)}</p>
        ${n.stocks && n.stocks.length ? `<div style="margin-bottom:4px">${stockChips(n.stocks)}</div>` : ""}
        <div class="src">${esc(n.date)} · ${link(n.source, n.url)}</div></div>`).join("")}
      ${reps.map(reportItem).join("")}
    </div>`;
  };
  if (!secs.length && !t3.reports.length) return `<div class="fail">오늘 수집 실패: 섹터 뉴스·리포트 없음</div>`;
  return tpBox + secs.map(s => secCard(s.sector, s.mood, s.fail_reason, s.news, repOf(s.sector))).join("")

}

/* 영상에서 긍정·부정적으로 언급한 종목만 버튼으로 (단순 언급은 생략) */
function videoStocks(v) {
  const groups = [["긍정", "긍정적으로 언급"], ["부정", "부정적으로 언급"]].map(([ctx, label]) => {
    const list = (v.stocks || []).filter(s => s.context === ctx);
    if (!list.length) return "";
    const seen = new Set();
    const btns = list.filter(s => { const k = s.stock || s.name; if (seen.has(k)) return false; seen.add(k); return true; })
      .map(s => stockBtn(s.stock ? stockOf(s.stock) : {name: s.name, ticker: null}, (D.dup_mentions || []).includes(s.stock) ? "is-dup" : "")).join("");
    return `<div class="vgroup"><span class="vlabel ${ctxCls(ctx)}">${label}</span>${btns}</div>`;
  }).join("");
  return groups ? `<div class="vstocks">${groups}</div>` : "";
}

function renderT4() {
  const t = D.tab4;
  const vids = t.channels.flatMap(c => c.videos || []);
  let html = t.fail_reason && !vids.length ? `<div class="fail">${esc(t.fail_reason)}</div>` : "";
  if (t.note && vids.length) html += `<div class="note">${esc(t.note)}</div>`;
  const color = i => CH_COLORS[i % CH_COLORS.length];
  if (t.channels.length > 1) html += `<div class="subtabs" role="tablist">${t.channels.map((ch, i) =>
    `<button type="button" role="tab" class="subtab" data-ch="${i}"><span class="cdot" style="background:${color(i)}"></span>${esc(ch.name)} <span class="cnt">${ch.videos.length}</span></button>`).join("")}</div>`;
  // 브리핑 기준일 이틀 전보다 오래된 영상은 접어 둔다(오늘·어제 영상은 펼친 채로)
  const cutoff = new Date(D.generated_at); cutoff.setDate(cutoff.getDate() - 1); cutoff.setHours(0, 0, 0, 0);
  const vcard = v => `<div class="vcard">
      <h3>${link(v.title, v.url)}</h3>
      <div class="rmeta">${esc(fmtTime(v.published_at))}${v.speakers ? " · " + esc(v.speakers) : ""} · ${v.basis === "gemini" ? "Gemini 자동 요약, 원 영상 미검수" : `<span class="chip">${esc(v.status_note || "요약 없음")}</span>제목·설명만 표시`}</div>
      ${v.basis === "gemini" ? `
        ${(v.insight || []).length ? `<ul class="insight">${v.insight.slice(0, 2).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="small muted">인사이트 없음</p>`}
        ${videoStocks(v)}`
      : `<p class="small muted" style="white-space:pre-line">${esc((v.description || "").slice(0, 300))}</p>`}
    </div>`;
  html += t.channels.map((ch, i) => {
    const recent = ch.videos.filter(v => new Date(v.published_at) >= cutoff), old = ch.videos.filter(v => new Date(v.published_at) < cutoff);
    return `<div class="card chpanel" data-ch="${i}" style="--ch:${color(i)}">
    <div class="sector-head"><h3>${link(ch.name, ch.url)}</h3><span class="small muted">신규 영상 ${ch.videos.length}개 · 요약 ${ch.videos.filter(v => v.basis === "gemini").length}개</span></div>
    ${(ch.summary || []).length ? `<div class="tabsum" style="margin:12px 0 0"><div class="tabsum-h">${SPARK}${esc(ch.name)} ${ch.summary.length}줄 요약</div><ol>${ch.summary.map(x => `<li>${rich(x)}</li>`).join("")}</ol></div>` : ""}
    ${ch.fail_reason ? `<div class="fail" style="margin:10px 0 0">오늘 수집 실패: ${esc(ch.fail_reason)}</div>` : ""}
    ${!ch.videos.length && !ch.fail_reason && !t.fail_reason ? `<div class="muted small" style="margin-top:6px">기준 시간 안에 올라온 영상 없음</div>` : ""}
    <div style="margin-top:14px">${recent.map(vcard).join("")}</div>
    ${old.length ? `<details class="old"${recent.length ? "" : " open"}><summary>이전 영상 ${old.length}개</summary>${old.map(vcard).join("")}</details>` : ""}
  </div>`;
  }).join("");
  return html;
}

  currentNx = k;
  document.querySelectorAll(".nx-tab").forEach(b => b.setAttribute("aria-selected", b.dataset.nx === k));

function nxRank() {
  const N = window.MARKET_NEXT;
  if (!N) return {all: [], ranked: [], top5: []};
  const all = N.industries.flatMap(ind => (ind.companies || []).map(c => ({...c, ind})));
  // 같은 기업이 여러 산업에 있으면 점수가 높은 쪽 하나만 순위에 넣는다. 동점이면 ④ 밸류·선반영 → ⑤ Upside 순
  const byT = {};
  for (const c of all) { const k = c.ticker || c.name; if (!byT[k] || nxTotal(c) > nxTotal(byT[k])) byT[k] = c; }
  const ranked = Object.values(byT).sort((a, b) => nxTotal(b) - nxTotal(a) || (b.scores.valuation - a.scores.valuation) || (b.scores.upside - a.scores.upside));
  return {all, ranked, top5: ranked.filter(c => !c.overheated).slice(0, 5)};  // ⚠️ 과열 기업은 TOP 5에서 빼고 전체 점수표에만 둔다
}

  // 현재가: 자동 갱신 시세(market/prices.json)가 있으면 그것, 없으면 토요일 분석 시점 값
  const livePx = c => { const L = c.ticker && ((window.MARKET_PRICES || {}).stocks || {})[c.ticker]; return L && L.price ? L : null; };
  const co = c => { const L = livePx(c); return `<div class="nx-co ${c.overheated ? "hot" : ""}">
      <div class="hd">${stockBtn(aiStock(c))}<span class="nx-score">${nxTotal(c)}점${c.overheated ? " ⚠️" : ""}</span></div>
      <div class="px">${L ? `${esc(L.price)}${L.change_pct != null ? ` <span class="${L.change_pct > 0 ? "up" : L.change_pct < 0 ? "down" : ""}">${L.change_pct > 0 ? "+" : ""}${esc(L.change_pct)}%</span>` : ""} (${esc(L.price_as_of || "")})`
        : `${esc(c.price || "현재가 확인 필요")}${c.price_as_of ? ` (${esc(c.price_as_of)})` : ""}`}${c.perf_1y ? ` · 1년 ${esc(c.perf_1y)}` : ""}</div>
      <dl>${[["매출 연관", c.revenue_link], ["성장", c.growth], ["수익성", c.profitability], ["밸류", c.valuation], ["선반영", c.priced_in]]
        .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${rich(v)}</dd>`).join("")}</dl>${nxSrc(c.sources)}</div>`; };
  // 섹터 선택 탭: 전체 + 산업별(아이콘·짧은 이름·변곡점 구간). 누르면 그 산업 카드만 보인다
  const ordered = NX_GROUPS.flatMap(([g]) => N.industries.filter(i => i.group === g));
  h += `<div class="nx-pick" role="tablist" aria-label="섹터 선택">
    <button type="button" class="nx-tab" data-nx="all" aria-selected="${currentNx === "all"}" onclick="nxPick('all')">전체 <span class="cnt">${N.industries.length}</span></button>
    ${ordered.map((ind, i) => `${i === 0 || ordered[i - 1].group !== ind.group ? `<span class="nx-gl g-${esc(ind.group)}">${{green: "🟢 초입", yellow: "🟡 직전·도입", blue: "🔵 통과"}[ind.group] || ""}</span>` : ""}<button type="button" class="nx-tab" data-nx="${esc(ind.key)}" aria-selected="${currentNx === ind.key}" onclick="nxPick('${esc(ind.key)}')">${nxIcon(ind, 20)}${esc(nxShort(ind))}${ind.overheated ? " ⚠️" : ""}<span class="nx-st g-${esc(ind.group)}">${esc(NX_STAGE_SHORT[ind.stage] || ind.stage)}</span></button>`).join("")}
  </div>`;
  for (const [g, title] of NX_GROUPS) {
    const inds = N.industries.filter(i => i.group === g);
    if (!inds.length) continue;
    h += `<div class="nx-grp" data-g="${g}">${title} <span class="small muted">${inds.length}개 산업</span></div>`;
    h += inds.map(ind => `<div class="card nx-ind" data-ind="${esc(ind.key)}" data-g="${g}">
      <div class="sector-head"><h3 class="nx-h">${nxIcon(ind, 36)}${esc(ind.name)}${ind.overheated ? " ⚠️" : ""}</h3><span class="chip">${esc(ind.stage)}</span></div>
      <div class="nx-stage">${NX_STAGES.map(st => `<span class="${st === ind.stage ? "on" : ""}">${st}</span>`).join("")}</div>
      <div class="nx-kv"><div><b>침투율·상용화</b>${rich(ind.penetration || "확인 필요")}</div><div><b>증가 속도</b>${rich(ind.growth || "확인 필요")}</div><div><b>TAM</b>${rich(ind.tam || "확인 필요")}</div></div>
      ${(ind.recent_changes || []).length ? `<p class="nx-p"><b>최근 6~12개월</b></p><ul class="insight">${ind.recent_changes.map(x => `<li>${rich(x)}</li>`).join("")}</ul>` : ""}
      <p class="nx-p"><b>단계 판단 근거</b>${rich(ind.rationale || "")}</p>
      <p class="nx-p"><b>다음 Trigger</b>${rich(ind.next_trigger || "")}</p>
      <div class="nx-cos">${(ind.companies || []).map(co).join("")}</div>${nxSrc(ind.sources)}</div>`).join("");
  }
  h += `<p class="small muted">${esc(N.note || "침투율·매출·수주·CAPEX 등 확인된 수치를 우선했고, 확인하지 못한 값은 '확인 필요'로 둡니다. 점수는 브리핑 작성자의 판단이며 투자 권유가 아닙니다.")}</p>`;
  return h;
}

const SIG = {g: "🟢", y: "🟡", r: "🔴"};
const srcLink = (name, url) => url ? `<a class="tsrc" href="${esc(url)}" target="_blank" rel="noopener">${esc(name || "출처")}</a>` : (name ? `<span class="tsrc">${esc(name)}</span>` : "");
const kindTag = k => k ? `<span class="tkind ${k === "MEDIA REPORT" ? "media" : k === "미확인" ? "unk" : ""}">${esc(k)}</span>` : "";

function tpanel(title, body, cls = "") { return `<section class="tp ${cls}"><h3 class="tph">${esc(title)}</h3>${body}</section>`; }
