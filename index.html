<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증시 아침 브리핑</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --sub:#5b6470; --line:#e3e6ea; --soft:#f0f2f5;
  --up:#d6293e; --up-bg:#fdecee; --down:#1f5fd1; --down-bg:#eaf1fd; --flat:#6b7280; --flat-bg:#eef0f3;
  --accent:#111827; --warn:#b45309; --warn-bg:#fff6e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --card:#171b21; --ink:#e7eaee; --sub:#9aa3ae; --line:#2a3039; --soft:#1e232a;
    --up:#ff5c6c; --up-bg:#3a1a1f; --down:#5b9bff; --down-bg:#16243d; --flat:#9aa3ae; --flat-bg:#232932;
    --accent:#e7eaee; --warn:#fbbf24; --warn-bg:#33270f;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:20px 0 8px}
header h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
.meta{color:var(--sub);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.meta select{font:inherit;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:10px}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;font:inherit;font-weight:600;font-size:14px;border:0;background:none;color:var(--sub);padding:12px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
main{padding:18px 0 8px}
section.tab{display:none}
section.tab.on{display:block}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.muted{color:var(--sub)}
.small{font-size:13px}
.fail{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--sub);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--flat-bg);color:var(--flat);margin-right:4px;white-space:nowrap}
.chip.up{background:var(--up-bg);color:var(--up)} .chip.down{background:var(--down-bg);color:var(--down)}
.chip.dup{background:var(--accent);color:var(--bg)}
.chip.stock{background:var(--soft);color:var(--ink);font-weight:500}
.issue h3,.news h3,.report h3{font-size:15px;margin:0 0 6px;line-height:1.45}
.issue p,.news p{margin:0 0 6px}
.impact{font-size:14px;border-left:3px solid var(--line);padding-left:10px;color:var(--sub);margin:8px 0}
.src{font-size:12px;color:var(--sub)}
.src a{color:var(--sub)}
.sector-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sector-head h3{margin:0;font-size:16px}
.mood{margin:4px 0 10px;font-size:14px;color:var(--sub)}
.news{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.news:first-of-type{border-top:0;margin-top:0;padding-top:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp-list{list-style:none;margin:0;padding:0}
.tp-list li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tp-list li:last-child{border-bottom:0}
.report ul{margin:6px 0 8px;padding-left:18px}
.report li{margin:2px 0}
.rmeta{font-size:13px;color:var(--sub);margin-bottom:6px}
.stocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.scard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.scard .nm{font-weight:700}
.scard .px{font-variant-numeric:tabular-nums;font-size:14px}
.chart{height:190px;border-radius:8px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center}
.chart img{width:100%;height:100%;object-fit:contain;background:#fff}
.mentions{font-size:12px;color:var(--sub);margin:0;padding-left:16px}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.subtab{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;white-space:nowrap}
.subtab[aria-selected=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.subtab .cnt{font-weight:500;opacity:.75;margin-left:2px}
.mentions li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mentions li.more{list-style:none;margin-left:-16px}
.insight{margin:6px 0 8px;padding-left:18px;font-size:14px}
.insight li{margin:2px 0}
.vstocks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vgroup{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vlabel{font-size:12px;font-weight:700;margin-right:4px}
button.sbtn{font:inherit;font-size:12px;border:1px solid var(--line);cursor:pointer;margin:0}
button.sbtn:hover{border-color:var(--ink)}
.sbtn.is-dup{box-shadow:inset 0 0 0 1.5px var(--accent)}
dialog#stockdlg{border:0;padding:0;background:transparent;color:var(--ink);width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog#stockdlg::backdrop{background:rgba(0,0,0,.45)}
dialog#stockdlg .close{position:absolute;top:8px;right:10px;border:0;background:none;font-size:22px;line-height:1;color:var(--sub);cursor:pointer;z-index:1}
dialog#stockdlg .scard{position:relative;padding-top:14px}
dialog#stockdlg .scard .top{padding-right:28px}
dialog#stockdlg .chart{height:260px}
dialog#stockdlg .chart.tvov{height:340px}
.periods{display:flex;gap:4px}
.periods button{font:inherit;font-size:13px;font-weight:600;padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.periods button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
footer{border-top:1px solid var(--line);margin-top:24px;padding:18px 0 40px}
.tabsum{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.tabsum-h{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.tabsum ol{margin:0;padding-left:20px}
.tabsum li{margin:3px 0;font-size:15px;font-weight:500;line-height:1.55}
.srclist{columns:2;font-size:13px;padding-left:18px;color:var(--sub)}
.srclist li{break-inside:avoid;margin-bottom:3px}
@media (max-width:640px){
  .cols{grid-template-columns:1fr}
  .srclist{columns:1}
  .hide-m{display:none}
  th,td{padding:8px 5px}
}
</style>
</head>
<body>

  <h1>증시 아침 브리핑</h1>
  <div class="meta" id="meta"></div>
</header>

<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>
<dialog id="stockdlg"></dialog>

function stockLabel(s) {

}
/* 티커가 있는 종목은 누르면 차트·시세 카드가 팝업으로 뜬다 */
function stockBtn(s, cls = "") {

/* 종목별 언급 출처(탭3 리포트명, 탭4 영상명) */
function mentionMap() {

  </div>`;
}

/* TradingView 미니 차트: 탭이 보일 때 한 번만 그린다(숨은 탭에서는 크기가 0이 됨) */
function mountCharts(root) {
  root.querySelectorAll(".chart.tv:not([data-done])").forEach(el => {
    el.dataset.done = "1";
    el.innerHTML = `<div class="tradingview-widget-container" style="width:100%;height:100%"><div class="tradingview-widget-container__widget"></div></div>`;
    const sc = document.createElement("script");
    sc.async = true;
    if (el.classList.contains("tvov")) {  // 팝업: 기간 버튼(1개월~3년)이 있는 위젯
      sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js";
      sc.textContent = JSON.stringify({symbols: [[el.dataset.symbol + "|3M"]], dateRanges: ["1m|30", "3m|60", "12m|1D", "36m|1W"],
        chartOnly: false, showVolume: false, width: "100%", height: "100%", locale: "kr", colorTheme: dark ? "dark" : "light", isTransparent: true, autosize: true});
    } else {
      sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
      sc.textContent = JSON.stringify({symbol: el.dataset.symbol, width: "100%", height: "100%", locale: "kr", dateRange: "3M", colorTheme: dark ? "dark" : "light", isTransparent: true, autosize: true, chartOnly: false});
    }
    el.firstChild.appendChild(sc);
  });
}

function renderT1() {
  const t = D.tab1;
  if (t.fail_reason) return `<div class="fail">오늘 수집 실패: ${esc(t.fail_reason)}</div>`;
  const rows = t.indicators.map(i => `<tr>
      <td>${esc(i.name)}</td>
      <td class="num">${esc(i.value)}</td>
      <td class="num ${i.dir === "up" ? "up" : i.dir === "down" ? "down" : ""}">${esc(i.change)}</td>
      <td class="small muted">${esc(i.as_of)}${i.source ? `<br>${link(i.source, i.url)}` : ""}</td></tr>`).join("");
  const mentions = mentionMap();
  return `
  <h2>관심 종목</h2>
  <div class="stocks-grid">${(D.watchlist.stocks || []).map(s => stockCard(s, mentions)).join("")}</div>
  <h2>주요 지표</h2>
  <div class="card" style="padding:4px 10px"><table>
    <thead><tr><th>지표</th><th class="num">종가</th><th class="num">전일 대비</th><th>기준 시각 · 출처</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <h2>핵심 이슈</h2>
  ${t.issues.map((x, i) => `<div class="card issue">
    <h3>${i + 1}. ${esc(x.title)}</h3><p>${esc(x.body)}</p>
    <div class="impact"><b>시장 영향</b> · ${esc(x.impact)}</div>
    <div class="src">출처: ${x.sources.map(s => link(s.name, s.url)).join(" · ")}</div></div>`).join("")}
  <h2>주요 일정</h2>
  <div class="card" style="padding:4px 10px"><table>
    <thead><tr><th>날짜</th><th>일정</th><th class="hide-m">출처</th></tr></thead>
    <tbody>${t.schedule.map(s => `<tr><td style="white-space:nowrap">${esc(s.date)}</td><td>${esc(s.event)}</td><td class="small muted hide-m">${link(s.source, s.url)}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

function renderT2() {
  const secs = D.tab2.sectors || [];
  if (!secs.length) return `<div class="fail">오늘 수집 실패: 섹터 뉴스 없음</div>`;
  return secs.map(s => {
    const tally = {호재: 0, 악재: 0, 중립: 0}; s.news.forEach(n => tally[n.tag]++);
    return `<div class="card">
      <div class="sector-head"><h3>${esc(s.sector)}</h3>
        <span>${Object.entries(tally).filter(([, v]) => v).map(([k, v]) => `<span class="chip ${tagCls(k)}">${k} ${v}</span>`).join("")}</span></div>
      ${s.fail_reason ? `<div class="fail" style="margin:10px 0 0">오늘 수집 실패: ${esc(s.fail_reason)}</div>` : `<div class="mood">${esc(s.mood)}</div>`}
      ${s.news.map(n => `<div class="news">
        <h3><span class="chip ${tagCls(n.tag)}">${esc(n.tag)}</span>${esc(n.title)}</h3>
        <p>${esc(n.body)}</p>
        ${n.stocks && n.stocks.length ? `<div style="margin-bottom:4px">${stockChips(n.stocks)}</div>` : ""}
        <div class="src">${esc(n.date)} · ${link(n.source, n.url)}</div></div>`).join("")}
    </div>`;
  }).join("");
}

function tpLine(x) {
  const s = stockOf(x.stock), u = x.unit || "원";
  return `<li>${stockBtn(s)} · ${esc(x.broker)}<br>
    <span class="small">${fmtNum(x.tp_old)} → ${fmtNum(x.tp_new)}${esc(u)} <b class="${dirCls(x.tp_change_pct)}">(${x.tp_change_pct > 0 ? "+" : ""}${x.tp_change_pct}%)</b></span></li>`;
}

function renderT3() {
  const t = D.tab3;
  if (t.fail_reason && !t.reports.length) return `<div class="fail">오늘 수집 실패: ${esc(t.fail_reason)}</div>`;
  const mentions = mentionMap();
  const tickers = [...new Set(t.reports.flatMap(r => (r.stocks || []).map(x => typeof x === "string" ? x : x.ticker)).filter(Boolean))];
  return `
  ${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}
  <div class="cols">
    <div class="card"><h3 class="up" style="margin:0 0 6px;font-size:15px">목표가 상향 ${t.up.length}</h3>
      ${t.up.length ? `<ul class="tp-list">${t.up.map(tpLine).join("")}</ul>` : `<div class="muted small">이번 기간 확인된 상향 없음</div>`}</div>
    <div class="card"><h3 class="down" style="margin:0 0 6px;font-size:15px">목표가 하향 ${t.down.length}</h3>
      ${t.down.length ? `<ul class="tp-list">${t.down.map(tpLine).join("")}</ul>` : `<div class="muted small">이번 기간 확인된 하향 없음</div>`}</div>
  </div>
  <h2>리포트</h2>
  ${t.reports.map(r => {
    const tp = r.tp_new ? `${r.tp_old ? fmtNum(r.tp_old) + " → " : ""}${fmtNum(r.tp_new)}${esc(r.unit || "원")}${r.tp_change_pct != null ? ` <b class="${dirCls(r.tp_change_pct)}">(${r.tp_change_pct > 0 ? "+" : ""}${r.tp_change_pct}%)</b>` : ""}` : "";
    return `<div class="card report">
      <div class="rmeta"><span class="chip">${esc(r.region)}</span>${esc(r.broker)}${r.analyst ? " · " + esc(r.analyst) : ""} · ${esc(r.date)}</div>
      <h3>${esc(r.title)}</h3>
      <ul>${r.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      ${r.opinion || tp ? `<div class="small">투자의견 ${esc(r.opinion || "–")}${tp ? ` · 목표주가 ${tp}` : ""}</div>` : ""}
      ${r.stocks && r.stocks.length ? `<div style="margin:6px 0 4px">${stockChips(r.stocks)}</div>` : ""}
      <div class="src">${link(r.source, r.url)}</div></div>`;
  }).join("")}
  ${tickers.length ? `<h2>언급 종목</h2><div class="stocks-grid">${tickers.map(x => stockCard(x, mentions)).join("")}</div>` : ""}`;
}

/* 영상에서 긍정·부정적으로 언급한 종목만 버튼으로 (단순 언급은 생략) */
function videoStocks(v) {
  const groups = [["긍정", "긍정적으로 언급"], ["부정", "부정적으로 언급"]].map(([ctx, label]) => {
    const list = (v.stocks || []).filter(s => s.context === ctx);
    if (!list.length) return "";
    const seen = new Set();
    const btns = list.filter(s => { const k = s.stock || s.name; if (seen.has(k)) return false; seen.add(k); return true; })
      .map(s => stockBtn(s.stock ? stockOf(s.stock) : {name: s.name, ticker: null}, (D.dup_mentions || []).includes(s.stock) ? "is-dup" : "")).join("");
    return `<div class="vgroup"><span class="vlabel ${ctxCls(ctx)}">${label}</span>${btns}</div>`;
  }).join("");
  return groups ? `<div class="vstocks">${groups}</div>` : "";
}

function renderT4() {
  const t = D.tab4;
  const vids = t.channels.flatMap(c => c.videos || []);
  let html = t.fail_reason && !vids.length ? `<div class="fail">${esc(t.fail_reason)}</div>` : "";
  if (t.note && vids.length) html += `<div class="note">${esc(t.note)}</div>`;
  if (t.channels.length > 1) html += `<div class="subtabs" role="tablist">${t.channels.map((ch, i) =>
    `<button type="button" role="tab" class="subtab" data-ch="${i}">${esc(ch.name)} <span class="cnt">${ch.videos.length}</span></button>`).join("")}</div>`;
  html += t.channels.map((ch, i) => `<div class="card chpanel" data-ch="${i}">
    <div class="sector-head"><h3>${link(ch.name, ch.url)}</h3><span class="small muted">신규 영상 ${ch.videos.length}개</span></div>
    ${ch.fail_reason ? `<div class="fail" style="margin:10px 0 0">오늘 수집 실패: ${esc(ch.fail_reason)}</div>` : ""}
    ${!ch.videos.length && !ch.fail_reason && !t.fail_reason ? `<div class="muted small" style="margin-top:6px">기준 시간 안에 올라온 영상 없음</div>` : ""}
    ${ch.videos.map(v => `<div class="news">
      <h3>${link(v.title, v.url)}</h3>
      <div class="rmeta">업로드 ${esc(fmtTime(v.published_at))}${v.speakers ? " · " + esc(v.speakers) : ""} · ${v.basis === "gemini" ? "Gemini 자동 요약, 원 영상 미검수" : "자막 미확보"}</div>
      ${v.basis === "gemini" ? `
        ${(v.insight || []).length ? `<ul class="insight">${v.insight.slice(0, 2).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="small muted">인사이트 없음</p>`}
        ${videoStocks(v)}`
      : `<p class="small muted">${esc((v.description || "").slice(0, 300))}</p>`}
    </div>`).join("")}
  </div>`).join("");
  return html;
}

function render() {
  const main = document.getElementById("main");
  document.getElementById("meta").innerHTML = `
    <span>생성 ${esc(fmtTime(D.generated_at))}</span>
    <span>데이터 기준: ${esc(D.data_basis)}</span>
    ${DAYS.length > 1 ? `<select id="daysel">${DAYS.map(d => `<option ${d.date === D.date ? "selected" : ""}>${d.date}</option>`).join("")}</select>` : `<span>${esc(D.date)}</span>`}`;
  const sel = document.getElementById("daysel");
  if (sel) sel.onchange = () => { D = DAYS.find(d => d.date === sel.value); render(); };
  const fns = {t1: renderT1, t2: renderT2, t3: renderT3, t4: renderT4};
  const tabSum = id => {
    const lines = (D.tab_summaries || {})[id] || [];
    return lines.length ? `<div class="tabsum"><div class="tabsum-h">3줄 요약</div><ol>${lines.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : "";
  };
  main.innerHTML = TABS.map(([id]) => `<section class="tab" id="${id}" role="tabpanel">${tabSum(id)}${fns[id]()}</section>`).join("");
  document.getElementById("foot").innerHTML = `
    <div class="muted small" style="margin-bottom:6px">전체 출처</div>
    <ol class="srclist">${D.sources.map(s => `<li>${link(s.name, s.url)}</li>`).join("")}</ol>
    <p class="small muted">빨강 = 상승·호재·상향, 파랑 = 하락·악재·하향. 투자 권유가 아니며, 요약은 원문을 바탕으로 다시 쓴 것입니다.</p>`;
  showChannel(Math.min(currentCh, Math.max(0, D.tab4.channels.length - 1)));
  show(current);
}

/* 유튜브 탭의 채널별 하위 탭 */
let currentCh = 0;
function showChannel(i) {
  currentCh = i;
  document.querySelectorAll(".subtab").forEach(b => b.setAttribute("aria-selected", +b.dataset.ch === i));
  if (document.querySelector(".subtab")) document.querySelectorAll(".chpanel").forEach(p => p.hidden = +p.dataset.ch !== i);
}

function show(id) {
  current = id;
  document.querySelectorAll("#tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === id));
  mountCharts(document.getElementById(id));
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}

document.getElementById("tabbar").innerHTML = TABS.map(([id, nm]) => `<button role="tab" data-id="${id}">${nm}</button>`).join("");
document.getElementById("tabbar").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.id); };
const dlg = document.getElementById("stockdlg");
document.addEventListener("click", e => {
  const b = e.target.closest(".sbtn");
  if (b) {
    dlg.innerHTML = stockCard(b.dataset.t, mentionMap(), true);
    dlg.querySelector(".scard").insertAdjacentHTML("afterbegin", `<button type="button" class="close" aria-label="닫기">×</button>`);
    dlg.showModal();
    mountCharts(dlg);
    return;
  }
  if (e.target === dlg || e.target.closest("#stockdlg .close")) dlg.close();
  const pb = e.target.closest(".periods button");
  if (pb) {
    const box = pb.parentElement;
    box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === pb));
    box.nextElementSibling.querySelector("img").src = naverImg(box.dataset.t, pb.dataset.p);
    return;
  }
  const st = e.target.closest(".subtab");
  if (st) showChannel(+st.dataset.ch);
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (D && h !== current && TABS.some(([id]) => id === h)) show(h); });
if (!DAYS.length) {
  document.getElementById("main").innerHTML = `<div class="fail">브리핑 데이터가 비어 있습니다. python scripts/build_market.py를 실행하세요.</div>`;
} else {
  D = DAYS[0];
  const h = location.hash.slice(1);
  if (TABS.some(([id]) => id === h)) current = h;
  render();
}
</script>
</body>
